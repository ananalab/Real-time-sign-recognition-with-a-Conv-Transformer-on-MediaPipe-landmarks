# Robustness of the negative transfer result: lower fine-tuning learning rate, and a linear probe
# (encoder frozen for the whole training) to test whether ASL features are informative for LSFB.
name: lsfb-transfer-check
sources:
- lsfb_isol
pretrained_from:
- anaisazouaoui/signrec-asl-main
runs:
- run_name: lsfb-ftlowlr-n5-s0
  overrides:
  - data.root=data/processed/lsfb_isol
  - data.split=splits/lsfb_isol_signer.json
  - train.cache_val=true
  - transfer.init_from=models/asl-transformer-s0/best.pt
  - seed=0
  - train.epochs=300
  - train.patience=75
  - train.lr=2.0e-4
  - train.warmup_epochs=1
  - data.max_per_class=5
  - train.num_workers=0
